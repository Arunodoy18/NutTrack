plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdkVersion 36
    namespace "tech.buildc3.nura"
    defaultConfig {
        applicationId "tech.buildc3.nura"
        minSdkVersion 29
        targetSdkVersion 36
        versionCode 7
        versionName "1.2.4"
    }
    buildTypes {
        // QA only (never published): the shipped release code, minified the same way, but inspectable and debug-signed.
        qa {
            initWith release
            debuggable true
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.guava:guava:33.0.0-android'
    // Health Connect on Android 9-13 (Android 14+ uses the built-in framework API directly)
    implementation 'androidx.health.connect:connect-client:1.1.0-rc03'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
